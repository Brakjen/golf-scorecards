dbs:
  - path: /data/golf_scorecards.db
    replicas:
      - type: s3
        bucket: ${BUCKET_NAME}
        path: litestream
        endpoint: ${AWS_ENDPOINT_URL_S3}
        region: ${AWS_REGION}
        access-key-id: ${AWS_ACCESS_KEY_ID}
        secret-access-key: ${AWS_SECRET_ACCESS_KEY}
        sync-interval: 60s

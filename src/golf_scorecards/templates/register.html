{% extends "base.html" %}

{% block title %}Register · Golf Scorecards{% endblock %}

{% block tabbar %}{% endblock %}

{% block body %}
<main class="page-shell login-shell">
  <section class="login-card">
    <h1>Create account</h1>

    {% if error %}
    <p class="login-card__error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/register" class="login-form">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" autocomplete="username"
             autofocus required minlength="2">

      <label for="display_name">Display name</label>
      <input id="display_name" type="text" name="display_name" autocomplete="name"
             placeholder="Optional">

      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="new-password"
             required minlength="6">

      {% if require_invite %}
      <label for="invite_code">Invite code</label>
      <input id="invite_code" type="text" name="invite_code" required>
      {% endif %}

      <button type="submit">Register</button>
    </form>

    <p class="login-card__hint">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </section>
</main>
{% endblock %}
